[package]
name = "shagi-mobile"
version = "0.1.0"
description = "ШАГИ — тонкая оболочка Android (SPEC/00 §3): ни одного экрана, только точка входа и платформенный манифест"
authors = ["СИМПАС"]
edition = "2021"
rust-version = "1.94"
publish = false

[lib]
# Имя видит и Gradle: `tauri android init` подставляет его в
# `System.loadLibrary` — менять без переинициализации `gen/android` нельзя.
name = "shagi_mobile_lib"
# cdylib — то, что грузит Android; staticlib — задел под iOS-цель
# (SPEC/00 §1.2, «архитектурно обязательная готовность»); rlib — чтобы
# `main.rs` и тесты собирались как обычная библиотека на хосте.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-alarm-capability = { path = "plugins/alarm-capability" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Локальный патч `tauri-plugin-notification` 2.4.0 — дословная копия крейта с
# crates.io с ОДНИМ изменением в `android/src/main/java/NotificationStorage.kt`
# (`vendor/.../PATCH.md`, ADR-0008 дополнение от 2026-09-04). Апстрим падал с
# NPE в `getPending()` на записи, чей `sourceJson` был `null` (то есть на любой
# записи, созданной командой `batch` — единственным путём планирования у
# ШАГОВ), из-за чего ломался первый шаг startup-реконсиляции и напоминание не
# восстанавливалось после Force Stop. Версия и API крейта не менялись —
# `[patch]`, а не форк: путь обновления при новой версии апстрима описан в
# `PATCH.md`. `tauri android init` берёт Kotlin-исходники по
# `CARGO_MANIFEST_DIR` крейта (его `build.rs`: `.android_path("android")`),
# поэтому патч доезжает до APK именно через эту подмену источника.
[patch.crates-io]
tauri-plugin-notification = { path = "vendor/tauri-plugin-notification-2.4.0" }

[dev-dependencies]
tempfile = "3.27.0"
