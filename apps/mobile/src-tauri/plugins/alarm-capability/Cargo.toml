[package]
name = "tauri-plugin-alarm-capability"
version = "0.1.0"
edition = "2021"
# Только Android — точный alarm capability check имеет смысл только там
# (00§11.1: Windows/Web не имеют этого механизма вовсе).
# `links` обязателен для `tauri_plugin::Builder` с `android_path` — без него
# build.rs падает на старте ("package.links field ... is not set"), см.
# tauri-plugin-notification/Cargo.toml как образец.
links = "tauri-plugin-alarm-capability"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# `tauri::test::MockRuntime` (юнит-тесты desktop.rs, шаг 5b брифа) собран под
# `#[cfg(any(test, feature = "test"))]` внутри самого `tauri` — этот `cfg(test)`
# относится к сборке крейта `tauri`, а не нашего, поэтому фичу нужно включить явно.
tauri = { version = "2", features = ["test"] }
