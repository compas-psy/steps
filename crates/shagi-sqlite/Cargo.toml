[package]
name = "shagi-sqlite"
version = "0.1.0"
description = "ШАГИ — нативный мост к SQLite, общий для оболочек Android и Windows (ADR-0005)"
authors = ["СИМПАС"]
edition = "2021"
rust-version = "1.94"
publish = false

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"
