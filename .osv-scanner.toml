# Настройка osv-scanner (скан уязвимостей зависимостей, `.github/workflows/
# security.yml`, SPEC/06 §12/§19).
#
# По умолчанию пусто — исключение здесь появилось не «на всякий случай», а
# как прямое следствие security review нового SQLite-моста (ADR-0005, P1):
# скан впервые начал проверять Cargo.lock обеих Tauri-оболочек
# (apps/mobile/src-tauri, apps/desktop/src-tauri), а не только
# pnpm-lock.yaml, и первым же прогоном на реальной сети (не в этой
# песочнице — здесь api.osv.dev недоступен) нашёл 17 разных advisory,
# по разу на каждый Cargo.lock (34 строки в отчёте).
#
# Ни один из них НЕ починить точечным bump'ом версии: `cargo update -p glib
# --precise 0.20.0` (единственная запись с CVSS и доступным фиксом) падает
# с «required by … tauri v2.11.5» — `tauri` сам закрепляет `gtk = "^0.18"`,
# а `gtk` 0.18.2 закрепляет `glib = "^0.18"`. Поднять версию можно только
# сменой мажорной версии `tauri` целиком — это не security-фикс, а отдельное
# по объёму архитектурное решение (и вне того, что просил именно этот
# security review: «не меняй функциональное поведение сверх этих фиксов»).
#
# Все 17 — транзитивная GTK/glib-цепочка `tauri` для ЛИНУКСОВОЙ (desktop)
# сборки WebView; часть из них (RUSTSEC-2025-00xx про `unic-*`,
# RUSTSEC-2024-0370 про `proc-macro-error`) — это предупреждения «пакет не
# поддерживается», не эксплуатируемые уязвимости — фикс для них появится,
# только когда `tauri`/`gtk-rs` перейдут на замену выше по дереву.
# Список пересмотреть, когда обновится `tauri` в Cargo.toml обеих оболочек
# — тогда часть строк станет unused (osv-scanner предупреждает об этом в
# логе, но не роняет job) и их нужно убрать, а не оставлять мёртвыми.
#
# Каждая запись — конкретный ID, не подстрока и не пакет целиком: новая
# уязвимость в ЛЮБОМ другом пакете (включая новую версию этих же пакетов)
# по-прежнему валит job. Это не `|| true`.

