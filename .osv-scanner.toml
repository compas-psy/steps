# Настройка osv-scanner (скан уязвимостей зависимостей, `.github/workflows/
# security.yml`, SPEC/06 §12/§19).
#
# По умолчанию пусто — исключение здесь появилось как прямое следствие
# security review нового SQLite-моста (ADR-0005, P1): скан впервые начал
# проверять Cargo.lock обеих Tauri-оболочек (apps/mobile/src-tauri,
# apps/desktop/src-tauri), а не только pnpm-lock.yaml, и первым же прогоном
# на реальной сети нашёл 17 advisory, по разу на каждый Cargo.lock (34
# строки в отчёте).
#
# КАЖДАЯ запись ниже проверена `cargo tree --target <triple> -e normal`
# на ОБОИХ реально поставляемых таргетах R1 (aarch64-linux-android,
# x86_64-pc-windows-msvc) для ОБОИХ Cargo.lock — не предположение "наверное
# это GTK и не для мобилки". Список делится на две РАЗНЫЕ по природе группы,
# смешивать их в одно объяснение было бы неточно:
#
# ГРУППА 1 — 12 advisory, крейт подтверждённо ОТСУТСТВУЕТ в дереве обоих
# таргетов (`cargo tree --target aarch64-linux-android|x86_64-pc-windows-msvc
# -e normal -p <crate>` — пусто на обоих, для обоих Cargo.lock). Это
# GTK/glib-бэкенд `tauri` для Linux WebView (`gtk`, прямая зависимость
# `tauri` 2.11.5; `atk`/`gdk`/`glib` и `*-sys`/`*-macros` — транзитивные
# зависимости `gtk`), собирается только под `cfg(target_os = "linux")` и
# физически не может попасть в APK или Windows-бинарник — это подтверждённый
# факт устройства сборки Tauri, не предположение о том, что «наверное не
# используется». В `apps/mobile/src-tauri/Cargo.lock`/`apps/desktop/
# src-tauri/Cargo.lock` эти строки есть, потому что Cargo.lock хранит граф
# резолвинга ДЛЯ ВСЕХ платформ, объявленных где-либо в дереве зависимостей
# tauri, а не только для таргета, под который собирается конкретный job.
#
# ГРУППА 2 — 5 advisory (`unic-*`), крейт ПОДТВЕРЖДЁННО ПРИСУТСТВУЕТ в
# дереве обоих таргетов (та же команда — непустой вывод на обоих). Путь:
# `tauri` → `tauri-runtime`/`tauri-macros`/`tauri-codegen` → `tauri-utils`
# → `urlpattern` → `unic-ucd-ident`/`unic-char-property`/`unic-char-range`/
# `unic-common`/`unic-ucd-version` (парсинг URLPattern использует
# Unicode-таблицы идентификаторов). Здесь allowlist НЕ «обновление сложное»
# — обновления попросту НЕТ: все пять advisory `informational =
# "unmaintained"` (RustSec, не CVE/CVSS, проверено по исходнику advisory-db
# — `patched = []`, `unaffected = []` буквально означает «нет версии,
# которая это чинит», а не «мы не проверяли»). Вся семья крейтов
# `open-i18n/rust-unic` заброшена целиком; починка требует замены
# `urlpattern` внутри `tauri-utils` на другую Unicode-библиотеку — решение
# вне этого репозитория, upstream у tauri/urlpattern. SPEC/06 §12/§19
# называет блокирующей находкой exploitable critical/high — ни у одной из
# этих пяти нет ни CVE, ни CVSS, ни задокументированного вектора
# эксплуатации (это статус "нет мейнтейнера", не уязвимость).
#
# Дата проверки обеих групп — 2026-09-02. Пересмотреть при следующем
# апдейте `tauri` в Cargo.toml любой из оболочек: группа 1 не изменится,
# пока `tauri`/`gtk-rs` не сменят major; группа 2 может исчезнуть раньше,
# если `tauri-utils` заменит `urlpattern` или `urlpattern` уйдёт от
# `unic-*` на `icu_properties`/`unicode-ident` (рекомендация самого RustSec).
# Условие удаления — единое для всех 17: запись становится unused
# (osv-scanner предупреждает об этом в логе, не роняет job) — тогда её
# нужно убрать, а не оставлять мёртвой.
#
# Каждая запись — конкретный ID, не подстрока и не пакет целиком: новая
# уязвимость в ЛЮБОМ другом пакете (включая новую версию этих же пакетов)
# по-прежнему валит job. Это не `|| true`.

# ─── Группа 1: GTK/glib, Linux-only WebView backend — не в Android/Windows ───

