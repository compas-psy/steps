# Настройка gitleaks (скан секретов во всей истории git, `.github/workflows/
# security.yml`, SPEC/05 §18.1).
#
# Правила берутся СТАНДАРТНЫЕ и целиком (`useDefault = true`) — свой набор
# правил здесь не пишется: чужой поддерживаемый список известных форматов
# токенов заведомо полнее любого нашего.
#
# Ниже — единственное исключение, и оно узкое намеренно. Правило
# `generic-api-key` срабатывает по эвристике «идентификатор со словом key,
# двоеточие, строка в кавычках с высокой энтропией». Под неё попадают
# КЛЮЧИ КАТАЛОГА ЛОКАЛИЗАЦИИ (`@shagi/i18n`) вида `labelKey:
# 'bulk.priorityP1'`: точки и смесь регистров дают энтропию выше порога.
# Это не секрет и никогда им не станет — весь каталог `ru-RU` лежит в
# репозитории открытым текстом.
#
# Почему исключение, а не переименование поля: находка уже в истории git
# (коммит 29c0dfc), а gitleaks смотрит каждый коммит — переписать код
# сегодня значит оставить скан красным навсегда. Переписывать историю ради
# ложного срабатывания хуже, чем записать исключение явно и объяснимо.
#
# Исключение сознательно привязано к ТРЁМ вещам сразу, чтобы не превратиться
# в дыру: имя поля оканчивается на `Key`, значение — в одинарных кавычках и
# имеет форму ключа каталога (`namespace.dotted.path`, только латиница,
# цифры и точки), и всё это в исходниках TypeScript. Настоящий токен такой
# формы не бывает.

[extend]
useDefault = true

[[allowlists]]
description = "Ключи каталога локализации @shagi/i18n — не секреты"
regexTarget = "line"
regexes = [
  '''[A-Za-z]*Key\??\s*:\s*'[a-zA-Z][A-Za-z0-9]*(\.[A-Za-z0-9]+)+'(\s*\|\s*'[a-zA-Z][A-Za-z0-9]*(\.[A-Za-z0-9]+)+')*''',
]
paths = ['''packages/.*\.tsx?$''']
